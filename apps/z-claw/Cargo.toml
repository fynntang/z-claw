[package]
name = "z-claw"
version.workspace = true
edition.workspace = true
license.workspace = true


[dependencies]
z-claw-core.workspace = true
z-claw-config.workspace = true
z-claw-agent.workspace = true
z-claw-memory.workspace = true
z-claw-providers.workspace = true
z-claw-tools.workspace = true
z-claw-ui.workspace = true
z-claw-assets.workspace = true
gpui.workspace = true
gpui_macros.workspace = true
gpui_platform.workspace = true
ui.workspace = true
ui_input.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true


[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation_Numerics",
    "Storage_Search",
    "Storage_Streams",
    "System_Threading",
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Hlsl",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"



[package.metadata.bundle-dev]
icon = ["resources/icons/128x128@2x.png", "resources/icons/128x128.png"]
identifier = "dev.Z-Claw.Dev"
name = "Z-Claw Dev"
osx_minimum_system_version = "10.15.7"
osx_info_plist_exts = ["resources/info/*"]
osx_url_schemes = ["Z-Claw"]

[package.metadata.bundle-nightly]
icon = ["resources/icons/128x128@2x.png", "resources/icons/128x128.png"]
identifier = "dev.Z-Claw.Nightly"
name = "Z-Claw Nightly"
osx_minimum_system_version = "10.15.7"
osx_info_plist_exts = ["resources/info/*"]
osx_url_schemes = ["Z-Claw"]

[package.metadata.bundle-preview]
icon = ["resources/icons/128x128@2x.png", "resources/icons/128x128.png"]
identifier = "dev.Z-Claw.Preview"
name = "Z-Claw Preview"
osx_minimum_system_version = "10.15.7"
osx_info_plist_exts = ["resources/info/*"]
